version: 2
updates:
  # Update GitHub Actions weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday" # valid for weekly
    labels:
      - "dependencies"
      - "github-actions"

  # Update pnpm deps monthly for minor & patch; majors get their own PR immediately
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    versioning-strategy: auto
    labels:
      - "dependencies"
      - "pnpm"
    groups:
      all-minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
