name: "Bootstrap"
description: "Common boilerplate setup for workflows"

runs:
  using: "composite"
  steps:
    - name: Set up tools with mise
      uses: jdx/mise-action@v5
    - name: Set up pnpm
      uses: pnpm/setup@v3
      with:
        cache: true
        require-lockfile: true
        node-version-file: false
